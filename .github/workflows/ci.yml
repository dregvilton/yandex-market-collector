name: Go
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector
          POSTGRES_DB: collector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector -d collector"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://collector:collector@localhost:5432/collector?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
